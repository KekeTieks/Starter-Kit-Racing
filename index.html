<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
	<title>Racing</title>
	<style>
		body { margin: 0; overflow: hidden; background: #000; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
		canvas { display: block; touch-action: none; }
		#editor-link {
			position: absolute;
			bottom: 12px;
			right: 16px;
			color: #fff;
			font: 14px sans-serif;
			text-decoration: none;
			background: rgba(0,0,0,0.5);
			padding: 8px 14px;
			border-radius: 6px;
			z-index: 10;
		}
		#editor-link:hover { background: rgba(0,0,0,0.7); }
		@media (pointer: coarse) {
			#editor-link { bottom: auto; top: 12px; right: 12px; }
		}
		/* ─── Lobby ─────────────────────────────────────────── */
		#lobby {
			position: absolute;
			inset: 0;
			display: flex;
			align-items: center;
			justify-content: center;
			z-index: 20;
			background: rgba(0,0,0,0.75);
			backdrop-filter: blur(8px);
			overflow-y: auto;
			padding: 20px;
			box-sizing: border-box;
		}
		.lobby-panel {
			text-align: center;
			color: #fff;
			max-width: 720px;
			width: 100%;
		}
		.lobby-panel h1 {
			font-size: 48px;
			margin: 0 0 24px;
			font-weight: 700;
			letter-spacing: 2px;
		}
		.lobby-header-row {
			display: flex;
			align-items: center;
			justify-content: center;
			position: relative;
			margin-bottom: 20px;
		}
		.lobby-header-row h1 { margin: 0; }
		.back-btn {
			position: absolute;
			left: 0;
			background: rgba(255,255,255,0.1);
			border: none;
			border-radius: 8px;
			color: rgba(255,255,255,0.7);
			font-size: 14px;
			padding: 8px 14px;
			cursor: pointer;
			transition: all 0.15s;
		}
		.back-btn:hover { background: rgba(255,255,255,0.2); color: #fff; }

		/* ── Screen 1: Identity ── */
		.lobby-section {
			margin-bottom: 24px;
			text-align: left;
		}
		.lobby-label {
			font-size: 12px;
			font-weight: 600;
			letter-spacing: 1px;
			text-transform: uppercase;
			color: rgba(255,255,255,0.5);
			margin-bottom: 10px;
			display: block;
		}
		.username-input {
			width: 100%;
			padding: 12px 16px;
			border: 1px solid rgba(255,255,255,0.2);
			border-radius: 10px;
			background: rgba(255,255,255,0.08);
			color: #fff;
			font-size: 16px;
			box-sizing: border-box;
			outline: none;
			transition: border-color 0.15s;
		}
		.username-input:focus { border-color: rgba(74,158,255,0.6); }
		.username-input::placeholder { color: rgba(255,255,255,0.3); }

		/* ── Vehicle cards ── */
		.vehicle-grid {
			display: grid;
			grid-template-columns: repeat(4, 1fr);
			gap: 10px;
		}
		@media (max-width: 600px) {
			.vehicle-grid { grid-template-columns: repeat(2, 1fr); }
		}
		.vehicle-card {
			background: rgba(255,255,255,0.07);
			border: 2px solid transparent;
			border-radius: 12px;
			padding: 14px 10px;
			cursor: pointer;
			transition: all 0.15s;
			text-align: center;
		}
		.vehicle-card:hover { background: rgba(255,255,255,0.12); }
		.vehicle-card.active {
			border-color: #4a9eff;
			background: rgba(74,158,255,0.12);
		}
		.vehicle-color-dot {
			width: 32px;
			height: 32px;
			border-radius: 50%;
			margin: 0 auto 10px;
		}
		.vehicle-card-name {
			font-size: 13px;
			font-weight: 600;
			margin-bottom: 10px;
			color: rgba(255,255,255,0.9);
		}
		.vehicle-stats { text-align: left; }
		.stat-row {
			display: flex;
			align-items: center;
			gap: 6px;
			margin-bottom: 4px;
		}
		.stat-label {
			font-size: 10px;
			color: rgba(255,255,255,0.4);
			width: 44px;
			flex-shrink: 0;
		}
		.stat-bars { display: flex; gap: 3px; }
		.stat-dot {
			width: 8px;
			height: 8px;
			border-radius: 2px;
			background: rgba(255,255,255,0.15);
		}
		.stat-dot.filled { background: #4a9eff; }

		/* ── Screen 1 narrow variant ── */
		.lobby-panel--narrow {
			max-width: 420px;
		}

		/* ── Vehicle pill (Screen 2) ── */
		.vehicle-pill {
			width: 100%;
			display: flex;
			align-items: center;
			gap: 14px;
			background: rgba(255,255,255,0.06);
			border: 1px solid rgba(255,255,255,0.14);
			border-radius: 14px;
			padding: 14px 18px;
			cursor: pointer;
			transition: background 0.15s, border-color 0.15s;
			color: #fff;
			margin-bottom: 18px;
			text-align: left;
		}
		.vehicle-pill:hover {
			background: rgba(255,255,255,0.11);
			border-color: rgba(255,255,255,0.28);
		}
		.vehicle-pill-dot {
			width: 18px;
			height: 18px;
			border-radius: 50%;
			flex-shrink: 0;
		}
		.vehicle-pill-info {
			flex: 1;
			display: flex;
			flex-direction: column;
			gap: 4px;
		}
		.vehicle-pill-name {
			font-size: 15px;
			font-weight: 700;
		}
		.vehicle-pill-stats {
			font-size: 11px;
			color: rgba(255,255,255,0.4);
			display: flex;
			align-items: center;
			gap: 4px;
		}
		.vehicle-pill-stats .stat-dot {
			width: 6px;
			height: 6px;
		}
		.vehicle-pill-change {
			font-size: 12px;
			font-weight: 600;
			color: rgba(255,255,255,0.35);
			white-space: nowrap;
		}

		/* ── Vehicle carousel screen — full-screen split layout ── */

		/* Override #lobby centering for carousel: we take the full space */
		#lobby.vc-fullscreen {
			align-items: stretch;
			justify-content: stretch;
			padding: 0;
			overflow: hidden;
		}

		.vc-screen {
			width: 100%;
			height: 100%;
			display: grid;
			grid-template-columns: 1fr 400px;
			grid-template-rows: 1fr;
			color: #fff;
			position: relative;
		}

		/* ── Left: 3D stage ── */
		.vc-left {
			position: relative;
			display: flex;
			flex-direction: column;
			overflow: hidden;
		}

		/* Topbar sits over the canvas */
		.vc-topbar {
			position: absolute;
			top: 0; left: 0; right: 0;
			z-index: 2;
			display: flex;
			align-items: center;
			justify-content: space-between;
			padding: 24px 28px;
			background: linear-gradient(to bottom, rgba(0,0,0,0.55) 0%, transparent 100%);
		}
		.vc-title {
			font-size: 11px;
			font-weight: 800;
			letter-spacing: 0.25em;
			text-transform: uppercase;
			color: rgba(255,255,255,0.4);
		}

		/* Canvas fills the entire left column */
		.vc-canvas-wrap {
			flex: 1;
			width: 100%;
			height: 100%;
			position: relative;
			/* Subtle atmosphere gradient behind the canvas */
			background:
				radial-gradient(ellipse 70% 45% at 50% 65%, rgba(74,158,255,0.10) 0%, transparent 70%),
				linear-gradient(160deg, #0d0d1a 0%, #111122 60%, #0a0a14 100%);
		}
		.vc-canvas-wrap canvas {
			width: 100% !important;
			height: 100% !important;
			display: block;
		}

		/* Nav arrows overlaid on the canvas */
		.vc-nav-btn {
			position: absolute;
			top: 50%;
			transform: translateY(-50%);
			z-index: 3;
			width: 52px;
			height: 52px;
			border: 1px solid rgba(255,255,255,0.12);
			border-radius: 50%;
			background: rgba(0,0,0,0.35);
			backdrop-filter: blur(8px);
			color: #fff;
			font-size: 26px;
			line-height: 1;
			cursor: pointer;
			display: flex;
			align-items: center;
			justify-content: center;
			transition: background 0.15s, border-color 0.15s, transform 0.15s;
			padding: 0;
			padding-bottom: 2px;
		}
		.vc-nav-prev { left: 20px; }
		.vc-nav-next { right: 20px; }
		.vc-nav-btn:hover {
			background: rgba(74,158,255,0.25);
			border-color: rgba(74,158,255,0.5);
			transform: translateY(-50%) scale(1.08);
		}

		/* Dots at bottom of canvas */
		.vc-dots {
			position: absolute;
			bottom: 22px;
			left: 50%;
			transform: translateX(-50%);
			z-index: 3;
			display: flex;
			gap: 10px;
		}
		.vc-dot {
			width: 7px;
			height: 7px;
			border-radius: 50%;
			background: rgba(255,255,255,0.25);
			cursor: pointer;
			transition: background 0.2s, transform 0.2s;
			border: 1px solid rgba(255,255,255,0.1);
		}
		.vc-dot.active {
			transform: scale(1.5);
			border-color: transparent;
		}

		/* ── Right: info panel ── */
		.vc-right {
			display: flex;
			flex-direction: column;
			justify-content: center;
			gap: 28px;
			padding: 40px 36px;
			background: rgba(0,0,0,0.45);
			backdrop-filter: blur(20px);
			border-left: 1px solid rgba(255,255,255,0.06);
		}

		.vc-vehicle-name {
			font-size: 32px;
			font-weight: 900;
			letter-spacing: 0.02em;
			line-height: 1.1;
		}

		.vc-divider {
			width: 40px;
			height: 3px;
			background: linear-gradient(90deg, #4a9eff, #a855f7);
			border-radius: 99px;
			margin-top: -12px;
		}

		.vc-stats {
			display: flex;
			flex-direction: column;
			gap: 18px;
		}
		.vc-stat-row {
			display: flex;
			flex-direction: column;
			gap: 7px;
		}
		.vc-stat-header {
			display: flex;
			justify-content: space-between;
			align-items: baseline;
		}
		.vc-stat-label {
			font-size: 10px;
			font-weight: 700;
			text-transform: uppercase;
			letter-spacing: 0.12em;
			color: rgba(255,255,255,0.38);
		}
		.vc-stat-val {
			font-size: 13px;
			font-weight: 800;
			color: rgba(255,255,255,0.6);
		}
		.vc-stat-track {
			height: 4px;
			background: rgba(255,255,255,0.08);
			border-radius: 99px;
			overflow: hidden;
		}
		.vc-stat-fill {
			height: 100%;
			background: linear-gradient(90deg, #4a9eff, #a855f7);
			border-radius: 99px;
			transition: width 0.45s cubic-bezier(0.4, 0, 0.2, 1);
		}

		/* Select button */
		.vc-select-btn {
			width: 100%;
			padding: 16px;
			border: none;
			border-radius: 12px;
			background: linear-gradient(135deg, #4a9eff 0%, #2f7de0 100%);
			color: #fff;
			font-size: 14px;
			font-weight: 800;
			letter-spacing: 0.1em;
			text-transform: uppercase;
			cursor: pointer;
			transition: opacity 0.15s, transform 0.1s, box-shadow 0.15s;
			box-shadow: 0 4px 24px rgba(74,158,255,0.3);
		}
		.vc-select-btn:hover {
			opacity: 0.92;
			transform: translateY(-2px);
			box-shadow: 0 8px 32px rgba(74,158,255,0.45);
		}
		.vc-select-btn:active { transform: translateY(0); }

		/* Responsive: stack vertically on narrow screens */
		@media (max-width: 700px) {
			.vc-screen {
				grid-template-columns: 1fr;
				grid-template-rows: 55vh 1fr;
				overflow-y: auto;
			}
			.vc-right {
				border-left: none;
				border-top: 1px solid rgba(255,255,255,0.06);
				padding: 24px 20px;
			}
			#lobby.vc-fullscreen { overflow-y: auto; }
		}

		/* ── Primary button ── */
		.primary-btn {
			padding: 14px 32px;
			border: none;
			border-radius: 10px;
			font-size: 16px;
			font-weight: 600;
			cursor: pointer;
			transition: all 0.15s;
			background: #4a9eff;
			color: #fff;
			margin: 6px;
		}
		.primary-btn:hover { background: #3a8eef; }
		.primary-btn:disabled { opacity: 0.4; cursor: default; }

		/* ── Screen 2: Circuit selection ── */
		.circuit-grid {
			display: grid;
			grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
			gap: 12px;
			margin-bottom: 20px;
		}
		.circuit-card {
			background: rgba(255,255,255,0.07);
			border: 2px solid transparent;
			border-radius: 12px;
			padding: 12px;
			cursor: pointer;
			transition: all 0.15s;
			position: relative;
		}
		.circuit-card:hover { background: rgba(255,255,255,0.12); }
		.circuit-card.active {
			border-color: #4a9eff;
			background: rgba(74,158,255,0.12);
		}
		.circuit-minimap {
			display: flex;
			align-items: center;
			justify-content: center;
			margin-bottom: 8px;
			min-height: 60px;
		}
		.circuit-name {
			font-size: 12px;
			font-weight: 600;
			color: rgba(255,255,255,0.85);
			text-align: center;
			overflow: hidden;
			text-overflow: ellipsis;
			white-space: nowrap;
		}
		.circuit-delete-btn {
			position: absolute;
			top: 4px;
			right: 4px;
			background: rgba(220,60,60,0.6);
			border: none;
			border-radius: 4px;
			color: #fff;
			font-size: 10px;
			width: 18px;
			height: 18px;
			cursor: pointer;
			display: none;
			align-items: center;
			justify-content: center;
			padding: 0;
			line-height: 1;
		}
		.circuit-card:hover .circuit-delete-btn { display: flex; }

		/* ── Lobby shared ── */
		.lobby-buttons {
			display: flex;
			gap: 12px;
			justify-content: center;
			margin-bottom: 16px;
			flex-wrap: wrap;
		}
		.lobby-status {
			color: rgba(255,255,255,0.7);
			font-size: 14px;
			margin-bottom: 16px;
		}
		.lobby-room-info input {
			width: 100%;
			max-width: 360px;
			padding: 10px 14px;
			border: 1px solid rgba(255,255,255,0.2);
			border-radius: 8px;
			background: rgba(255,255,255,0.1);
			color: #fff;
			font-size: 13px;
			text-align: center;
			margin-top: 8px;
			box-sizing: border-box;
		}
		.lobby-room-info p {
			color: rgba(255,255,255,0.5);
			font-size: 13px;
			margin: 0;
		}
		.player-list {
			display: flex;
			gap: 10px;
			justify-content: center;
			flex-wrap: wrap;
			margin-bottom: 16px;
		}
		.player-badge {
			padding: 6px 14px;
			border-radius: 20px;
			font-size: 13px;
			font-weight: 500;
			background: rgba(255,255,255,0.12);
		}
		/* Lobby race options */
		.lobby-race-options {
			display: flex;
			flex-direction: column;
			align-items: center;
			gap: 16px;
			margin-top: 20px;
		}
		.mode-toggle {
			display: flex;
			gap: 4px;
			background: rgba(255,255,255,0.08);
			border-radius: 10px;
			padding: 4px;
		}
		.mode-btn {
			padding: 8px 20px;
			border: none;
			border-radius: 8px;
			background: transparent;
			color: rgba(255,255,255,0.5);
			font-size: 14px;
			font-weight: 600;
			cursor: pointer;
			transition: all 0.15s;
		}
		.mode-btn.active {
			background: rgba(255,255,255,0.18);
			color: #fff;
		}
		.lap-selector {
			display: flex;
			align-items: center;
			gap: 12px;
			color: rgba(255,255,255,0.7);
			font-size: 14px;
		}
		.lap-btn {
			width: 32px;
			height: 32px;
			border: 1px solid rgba(255,255,255,0.2);
			border-radius: 8px;
			background: rgba(255,255,255,0.08);
			color: #fff;
			font-size: 18px;
			cursor: pointer;
			display: flex;
			align-items: center;
			justify-content: center;
		}
		.lap-btn:hover { background: rgba(255,255,255,0.15); }
		#lap-count {
			min-width: 20px;
			text-align: center;
			font-weight: 600;
			font-size: 18px;
			color: #fff;
		}
		.start-btn {
			padding: 12px 40px;
			border: none;
			border-radius: 10px;
			background: #4a9eff;
			color: #fff;
			font-size: 16px;
			font-weight: 600;
			cursor: pointer;
			transition: background 0.15s;
		}
		.start-btn:hover { background: #3a8eef; }

		/* ── Mode screen — full-screen split layout ── */
		#lobby.ms-fullscreen {
			align-items: stretch;
			justify-content: stretch;
			padding: 0;
			overflow: hidden;
		}

		.ms-screen {
			width: 100%;
			height: 100%;
			display: grid;
			grid-template-columns: 1fr 420px;
			color: #fff;
			position: relative;
		}

		/* Left: player hero */
		.ms-left {
			position: relative;
			display: flex;
			align-items: center;
			justify-content: center;
			overflow: hidden;
			background: linear-gradient(160deg, #0d0d1a 0%, #111125 60%, #0a0a16 100%);
		}

		/* Atmospheric glow that takes the vehicle accent colour */
		.ms-bg-glow {
			position: absolute;
			inset: 0;
			background:
				radial-gradient(ellipse 65% 50% at 50% 60%, color-mix(in srgb, var(--accent) 18%, transparent) 0%, transparent 70%),
				radial-gradient(ellipse 40% 30% at 70% 20%, rgba(74,158,255,0.07) 0%, transparent 60%);
			pointer-events: none;
		}

		.ms-player-hero {
			position: relative;
			z-index: 1;
			display: flex;
			flex-direction: column;
			align-items: center;
			gap: 24px;
			padding: 40px 32px;
			max-width: 420px;
			width: 100%;
		}

		/* Avatar circle */
		.ms-avatar {
			position: relative;
			width: 100px;
			height: 100px;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			gap: 2px;
		}
		.ms-avatar-ring {
			position: absolute;
			inset: 0;
			border-radius: 50%;
			background: conic-gradient(var(--accent) 0%, rgba(168,85,247,0.6) 50%, transparent 100%);
			mask: radial-gradient(circle, transparent 70%, black 71%);
			-webkit-mask: radial-gradient(circle, transparent 70%, black 71%);
		}
		.ms-avatar-level {
			font-size: 32px;
			font-weight: 900;
			line-height: 1;
			color: #fff;
		}
		.ms-avatar-label {
			font-size: 9px;
			font-weight: 800;
			letter-spacing: 0.18em;
			color: rgba(255,255,255,0.4);
			text-transform: uppercase;
		}

		.ms-player-name {
			font-size: 26px;
			font-weight: 900;
			letter-spacing: 0.03em;
			text-align: center;
		}

		/* XP block */
		.ms-xp-block {
			width: 100%;
			display: flex;
			flex-direction: column;
			gap: 8px;
		}
		.ms-xp-header {
			display: flex;
			justify-content: space-between;
			align-items: baseline;
		}
		.ms-xp-title {
			font-size: 10px;
			font-weight: 800;
			letter-spacing: 0.14em;
			text-transform: uppercase;
			color: rgba(255,255,255,0.35);
		}
		.ms-xp-values {
			font-size: 11px;
			font-weight: 600;
			color: rgba(255,255,255,0.4);
		}
		.ms-xp-track {
			height: 6px;
			background: rgba(255,255,255,0.08);
			border-radius: 99px;
			overflow: hidden;
		}
		.ms-xp-fill {
			height: 100%;
			background: linear-gradient(90deg, #4a9eff, #a855f7);
			border-radius: 99px;
		}

		/* Stats pills row */
		.ms-stats-row {
			display: flex;
			gap: 10px;
			width: 100%;
		}
		.ms-stat-pill {
			flex: 1;
			display: flex;
			flex-direction: column;
			align-items: center;
			gap: 4px;
			padding: 12px 8px;
			background: rgba(255,255,255,0.05);
			border: 1px solid rgba(255,255,255,0.09);
			border-radius: 12px;

		.ms-stat-pill-val {
			font-size: 18px;
			font-weight: 900;
			color: #fff;

		.ms-stat-pill-label {
			font-size: 9px;
			font-weight: 700;
			text-transform: uppercase;
			letter-spacing: 0.1em;
			color: rgba(255,255,255,0.35);

		/* Vehicle selector */
		.ms-vehicle-btn {
			width: 100%;
			display: flex;
			align-items: center;
			gap: 14px;
			background: rgba(255,255,255,0.06);
			border: 1px solid rgba(255,255,255,0.12);
			border-radius: 14px;
			padding: 14px 18px;
			cursor: pointer;
			transition: background 0.15s, border-color 0.15s;
			color: #fff;
			text-align: left;

		.ms-vehicle-btn:hover {
			background: rgba(255,255,255,0.11);
			border-color: rgba(255,255,255,0.25);
		}
		.ms-vehicle-dot {
			width: 14px;
			height: 14px;
			border-radius: 50%;
			flex-shrink: 0;
		}
		.ms-vehicle-info {
			flex: 1;
			display: flex;
			flex-direction: column;
			gap: 4px;
		}
		.ms-vehicle-name {
			font-size: 14px;
			font-weight: 700;
		}
		.ms-vehicle-stats {
			font-size: 11px;
			color: rgba(255,255,255,0.4);
			display: flex;
			align-items: center;
			gap: 4px;
		}

		.ms-vehicle-caret {
			font-size: 14px;
			color: rgba(255,255,255,0.3);
			font-weight: 700;
			flex-shrink: 0;
		}

		/* Right: actions panel */
		.ms-right {
			display: flex;
			flex-direction: column;
			justify-content: center;
			background: rgba(0,0,0,0.42);
			backdrop-filter: blur(20px);
			border-left: 1px solid rgba(255,255,255,0.06);
			overflow-y: auto;
		}
		.ms-right-inner {
			padding: 40px 36px;
			display: flex;
			flex-direction: column;
			gap: 20px;
		}
		.ms-back-btn {
			align-self: flex-start;
			background: rgba(255,255,255,0.08);
			border: none;
			border-radius: 8px;
			color: rgba(255,255,255,0.6);
			font-size: 13px;
			padding: 8px 14px;
			cursor: pointer;
			transition: background 0.15s, color 0.15s;
		}
		.ms-back-btn:hover { background: rgba(255,255,255,0.16); color: #fff; }
		.ms-right-title {
			font-size: 22px;
			font-weight: 900;
			letter-spacing: 0.04em;
			margin: 0;
		}

		/* Mode cards */
		.ms-mode-cards {
			display: flex;
			flex-direction: column;
			gap: 10px;
		}
		.ms-mode-card {
			display: flex;
			flex-direction: column;
			align-items: flex-start;
			gap: 4px;
			padding: 18px 20px;
			background: rgba(255,255,255,0.06);
			border: 1px solid rgba(255,255,255,0.12);
			border-radius: 14px;
			color: #fff;
			cursor: pointer;
			transition: background 0.15s, border-color 0.15s, transform 0.12s;
			text-align: left;
		}
		.ms-mode-card:hover {
			background: rgba(255,255,255,0.12);
			border-color: rgba(255,255,255,0.28);
			transform: translateY(-2px);
		}
		.ms-mode-icon { font-size: 24px; }
		.ms-mode-title { font-size: 15px; font-weight: 800; }
		.ms-mode-desc { font-size: 12px; color: rgba(255,255,255,0.4); }

		.ms-divider {
			height: 1px;
			background: rgba(255,255,255,0.08);
		}

		/* Join section */
		.ms-join-section {
			display: flex;
			flex-direction: column;
			gap: 10px;
		}
		.ms-join-label {
			font-size: 11px;
			font-weight: 700;
			text-transform: uppercase;
			letter-spacing: 0.1em;
			color: rgba(255,255,255,0.35);
		}
		.ms-join-row {
			display: flex;
			gap: 8px;
			align-items: center;
		}

		/* Responsive: stack on small screens */
		@media (max-width: 700px) {
			.ms-screen {
				grid-template-columns: 1fr;
				grid-template-rows: auto 1fr;
				overflow-y: auto;
			}
			#lobby.ms-fullscreen { overflow-y: auto; }
			.ms-left { padding: 32px 20px; }
			.ms-right { border-left: none; border-top: 1px solid rgba(255,255,255,0.06); }
			.ms-right-inner { padding: 24px 20px; }
		}

		/* ── Connecting overlay ── */
		#connecting-overlay {
			position: absolute;
			inset: 0;
			z-index: 50;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			gap: 20px;
			background: rgba(0,0,0,0.6);
			backdrop-filter: blur(6px);
		}
		.conn-spinner {
			width: 44px;
			height: 44px;
			border: 3px solid rgba(255,255,255,0.12);
			border-top-color: #4a9eff;
			border-radius: 50%;
			animation: spin 0.7s linear infinite;
		}
		@keyframes spin { to { transform: rotate(360deg); } }
		.conn-label {
			font-size: 14px;
			font-weight: 600;
			color: rgba(255,255,255,0.6);
			letter-spacing: 0.05em;
		}

		/* ── Player profile bar (Screen 2) ── */
		.player-profile-bar {
			display: flex;
			align-items: center;
			gap: 14px;
			background: rgba(255,255,255,0.05);
			border: 1px solid rgba(255,255,255,0.1);
			border-radius: 14px;
			padding: 12px 16px;
			margin-bottom: 18px;
		}
		.ppb-avatar {
			width: 44px;
			height: 44px;
			border-radius: 50%;
			background: linear-gradient(135deg, #4a9eff 0%, #a855f7 100%);
			display: flex;
			align-items: center;
			justify-content: center;
			flex-shrink: 0;
		}
		.ppb-level {
			font-size: 15px;
			font-weight: 900;
			color: #fff;
		}
		.ppb-info {
			flex: 1;
			display: flex;
			flex-direction: column;
			gap: 6px;
			min-width: 0;
		}
		.ppb-name {
			font-size: 15px;
			font-weight: 700;
			color: #fff;
			white-space: nowrap;
			overflow: hidden;
			text-overflow: ellipsis;
		}
		.ppb-xp-row {
			display: flex;
			align-items: center;
			gap: 8px;
		}
		.ppb-xp-track {
			flex: 1;
			height: 5px;
			background: rgba(255,255,255,0.1);
			border-radius: 99px;
			overflow: hidden;
		}
		.ppb-xp-fill {
			height: 100%;
			background: linear-gradient(90deg, #4a9eff, #a855f7);
			border-radius: 99px;
			transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
		}
		.ppb-xp-label {
			font-size: 10px;
			font-weight: 600;
			color: rgba(255,255,255,0.35);
			white-space: nowrap;
			flex-shrink: 0;
		}
		.ppb-credits {
			display: flex;
			align-items: center;
			gap: 5px;
			flex-shrink: 0;
		}
		.ppb-credits-icon {
			font-size: 16px;
			line-height: 1;
		}
		.ppb-credits-val {
			font-size: 14px;
			font-weight: 800;
			color: #f5c842;
		}

		/* Mode selection screen */
		.mode-cards {
			display: grid;
			grid-template-columns: 1fr 1fr;
			gap: 12px;
			margin-bottom: 20px;
		}
		.mode-card {
			display: flex;
			flex-direction: column;
			align-items: center;
			gap: 6px;
			padding: 18px 12px;
			background: rgba(255,255,255,0.07);
			border: 1px solid rgba(255,255,255,0.15);
			border-radius: 12px;
			color: #fff;
			cursor: pointer;
			transition: background 0.15s, border-color 0.15s;
		}
		.mode-card:hover {
			background: rgba(255,255,255,0.14);
			border-color: rgba(255,255,255,0.3);
		}
		.mode-card-icon { font-size: 28px; }
		.mode-card-title { font-size: 15px; font-weight: 700; }
		.mode-card-desc { font-size: 12px; color: rgba(255,255,255,0.45); text-align: center; }
		.join-code-section {
			border-top: 1px solid rgba(255,255,255,0.1);
			padding-top: 16px;
			display: flex;
			flex-direction: column;
			align-items: center;
			gap: 10px;
		}
		.join-code-label {
			font-size: 12px;
			color: rgba(255,255,255,0.45);
			text-transform: uppercase;
			letter-spacing: 0.08em;
		}
		/* Join by code */
		.join-code-row {
			display: flex;
			gap: 8px;
			margin-top: 12px;
			align-items: center;
			justify-content: center;
		}
		.join-code-input {
			width: 100px;
			padding: 10px 12px;
			background: rgba(255,255,255,0.1);
			border: 1px solid rgba(255,255,255,0.2);
			border-radius: 8px;
			color: #fff;
			font-size: 18px;
			font-weight: 700;
			letter-spacing: 0.2em;
			text-align: center;
			font-family: monospace;
			text-transform: uppercase;
			outline: none;
		}
		.join-code-input:focus { border-color: rgba(255,255,255,0.5); }
		.secondary-btn {
			padding: 10px 18px;
			background: rgba(255,255,255,0.12);
			border: 1px solid rgba(255,255,255,0.2);
			border-radius: 8px;
			color: #fff;
			font-size: 14px;
			font-weight: 600;
			cursor: pointer;
			transition: background 0.15s;
		}
		.secondary-btn:hover { background: rgba(255,255,255,0.2); }

		/* ── Room lobby (multiplayer) — full screen ── */
		#lobby.room-fullscreen {
			align-items: stretch;
			justify-content: stretch;
			padding: 0;
			overflow: hidden;
		}
		.room-lobby {
			width: 100%;
			height: 100%;
			display: flex;
			flex-direction: column;
			color: #fff;
			overflow: hidden;
		}
		/* Top bar */
		.room-topbar {
			display: flex;
			align-items: center;
			justify-content: space-between;
			padding: 16px 28px;
			border-bottom: 1px solid rgba(255,255,255,0.08);
			flex-shrink: 0;
			background: rgba(0,0,0,0.2);
		}
		.room-title {
			font-size: 22px;
			font-weight: 800;
			letter-spacing: 3px;
			text-transform: uppercase;
			color: #fff;
		}
		.room-code-pill {
			display: flex;
			align-items: center;
			gap: 10px;
			background: rgba(255,255,255,0.06);
			border: 1px solid rgba(255,255,255,0.12);
			border-radius: 10px;
			padding: 8px 16px;
		}
		.room-code-pill-label {
			font-size: 10px;
			font-weight: 700;
			text-transform: uppercase;
			letter-spacing: 0.12em;
			color: rgba(255,255,255,0.35);
		}
		.room-code-pill-value {
			font-size: 22px;
			font-weight: 800;
			letter-spacing: 0.2em;
			font-family: 'Courier New', monospace;
			color: #fff;
		}
		.room-player-self {
			display: flex;
			align-items: center;
			gap: 8px;
		}
		.room-badge {
			font-size: 10px;
			font-weight: 800;
			letter-spacing: 0.1em;
			padding: 4px 10px;
			border-radius: 6px;
			text-transform: uppercase;
		}
		.room-badge.host { background: #f5a623; color: #111; }
		.room-badge.client { background: rgba(74,158,255,0.25); color: #4a9eff; border: 1px solid rgba(74,158,255,0.4); }
		.room-self-name {
			font-size: 14px;
			font-weight: 600;
			color: rgba(255,255,255,0.7);
		}
		/* Two-column body — fills remaining height */
		.room-body {
			display: grid;
			grid-template-columns: 1fr 1.6fr;
			gap: 0;
			flex: 1;
			overflow: hidden;
		}
		@media (max-width: 640px) {
			#lobby.room-fullscreen { overflow-y: auto; }
			.room-body { grid-template-columns: 1fr; overflow: visible; }
		}
		/* Panel shared */
		.room-panel {
			background: rgba(255,255,255,0.02);
			border: none;
			border-right: 1px solid rgba(255,255,255,0.07);
			overflow: hidden;
			display: flex;
			flex-direction: column;
		}
		.room-panel:last-child { border-right: none; }
		.room-panel-header {
			padding: 18px 24px 14px;
			font-size: 10px;
			font-weight: 700;
			text-transform: uppercase;
			letter-spacing: 0.14em;
			color: rgba(255,255,255,0.25);
			border-bottom: 1px solid rgba(255,255,255,0.06);
			flex-shrink: 0;
		}
		/* Players panel */
		.room-players-list {
			padding: 16px;
			display: flex;
			flex-direction: column;
			gap: 8px;
			flex: 1;
			overflow-y: auto;
		}
		.room-player-row {
			display: flex;
			align-items: center;
			gap: 14px;
			padding: 14px 16px;
			border-radius: 12px;
			background: rgba(255,255,255,0.04);
			border: 1px solid rgba(255,255,255,0.06);
			transition: background 0.15s;
		}
		.room-player-row.me {
			background: rgba(74,158,255,0.08);
			border: 1px solid rgba(74,158,255,0.15);
		}
		.room-player-row.empty {
			opacity: 0.25;
			background: transparent;
			border: 1px dashed rgba(255,255,255,0.1);
		}
		.room-player-dot {
			width: 14px;
			height: 14px;
			border-radius: 50%;
			flex-shrink: 0;
		}
		.room-player-name {
			flex: 1;
			font-size: 15px;
			font-weight: 600;
			color: #fff;
		}
		.room-player-row.empty .room-player-name {
			font-size: 13px;
			font-weight: 400;
			color: rgba(255,255,255,0.3);
		}
		.room-player-tag {
			font-size: 10px;
			font-weight: 700;
			letter-spacing: 0.08em;
			padding: 2px 7px;
			border-radius: 4px;
			text-transform: uppercase;
		}
		.room-player-tag.host-tag { background: rgba(245,166,35,0.2); color: #f5a623; }
		.room-player-tag.me-tag { background: rgba(74,158,255,0.2); color: #4a9eff; }
		/* Config panel */
		.room-config {
			padding: 24px;
			display: flex;
			flex-direction: column;
			gap: 20px;
			flex: 1;
			overflow-y: auto;
		}
		.room-config-row {
			display: flex;
			flex-direction: column;
			gap: 8px;
		}
		.room-config-label {
			font-size: 10px;
			font-weight: 700;
			text-transform: uppercase;
			letter-spacing: 0.12em;
			color: rgba(255,255,255,0.35);
		}
		/* Circuit preview */
		.room-circuit-preview {
			display: flex;
			align-items: center;
			gap: 12px;
			background: rgba(255,255,255,0.05);
			border: 1px solid rgba(255,255,255,0.08);
			border-radius: 10px;
			padding: 10px 14px;
		}
		.room-circuit-clickable {
			cursor: pointer;
			transition: background 0.15s, border-color 0.15s;
		}
		.room-circuit-clickable:hover {
			background: rgba(255,255,255,0.1);
			border-color: rgba(255,255,255,0.2);
		}
		.room-circuit-minimap {
			flex-shrink: 0;
			display: flex;
			align-items: center;
			justify-content: center;
		}
		.room-circuit-info {
			display: flex;
			flex-direction: column;
			gap: 2px;
		}
		.room-circuit-name {
			font-size: 14px;
			font-weight: 700;
			color: #fff;
		}
		.room-circuit-change {
			font-size: 11px;
			color: rgba(255,255,255,0.35);
		}
		/* Circuit selection overlay */
		.circuit-overlay {
			position: absolute;
			inset: 0;
			background: rgba(0,0,0,0.6);
			backdrop-filter: blur(6px);
			display: flex;
			align-items: center;
			justify-content: center;
			z-index: 10;
			padding: 20px;
			box-sizing: border-box;
		}
		.circuit-overlay-panel {
			background: rgba(20,20,35,0.98);
			border: 1px solid rgba(255,255,255,0.1);
			border-radius: 16px;
			padding: 24px;
			width: 100%;
			max-width: 600px;
			max-height: 80vh;
			overflow-y: auto;
		}
		/* Mode toggle */
		.room-mode-toggle {
			display: flex;
			gap: 4px;
			background: rgba(0,0,0,0.25);
			border-radius: 10px;
			padding: 4px;
		}
		.room-mode-btn {
			flex: 1;
			padding: 9px 0;
			border: none;
			border-radius: 8px;
			background: transparent;
			color: rgba(255,255,255,0.4);
			font-size: 13px;
			font-weight: 700;
			cursor: pointer;
			transition: all 0.15s;
			letter-spacing: 0.02em;
		}
		.room-mode-btn.active {
			background: rgba(255,255,255,0.14);
			color: #fff;
		}
		.room-mode-btn:disabled { cursor: default; }
		/* Lap counter */
		.room-lap-row {
			display: flex;
			align-items: center;
			justify-content: space-between;
			background: rgba(255,255,255,0.05);
			border: 1px solid rgba(255,255,255,0.08);
			border-radius: 10px;
			padding: 8px 12px;
		}
		.room-lap-label {
			font-size: 14px;
			color: rgba(255,255,255,0.6);
			font-weight: 500;
		}
		.room-lap-controls {
			display: flex;
			align-items: center;
			gap: 14px;
		}
		.room-lap-btn {
			width: 28px;
			height: 28px;
			border: 1px solid rgba(255,255,255,0.15);
			border-radius: 7px;
			background: rgba(255,255,255,0.07);
			color: #fff;
			font-size: 16px;
			cursor: pointer;
			display: flex;
			align-items: center;
			justify-content: center;
			transition: background 0.15s;
			line-height: 1;
			padding: 0;
		}
		.room-lap-btn:hover:not(:disabled) { background: rgba(255,255,255,0.15); }
		.room-lap-btn:disabled { opacity: 0.3; cursor: default; }
		.room-lap-value {
			font-size: 20px;
			font-weight: 800;
			color: #fff;
			min-width: 24px;
			text-align: center;
		}
		/* Start button */
		.room-start-btn {
			width: 100%;
			padding: 14px;
			border: none;
			border-radius: 10px;
			background: linear-gradient(135deg, #4a9eff, #2f7de0);
			color: #fff;
			font-size: 15px;
			font-weight: 800;
			letter-spacing: 0.06em;
			text-transform: uppercase;
			cursor: pointer;
			transition: opacity 0.15s, transform 0.1s;
			margin-top: 4px;
		}
		.room-start-btn:hover { opacity: 0.9; transform: translateY(-1px); }
		.room-start-btn:active { transform: translateY(0); }
		/* Waiting animation for clients */
		.room-waiting {
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			gap: 12px;
			padding: 24px 16px;
			color: rgba(255,255,255,0.4);
			font-size: 13px;
			font-weight: 500;
		}
		.room-waiting-dots {
			display: flex;
			gap: 6px;
		}
		.room-waiting-dots span {
			width: 7px;
			height: 7px;
			border-radius: 50%;
			background: rgba(255,255,255,0.3);
			animation: waiting-pulse 1.4s ease-in-out infinite;
		}
		.room-waiting-dots span:nth-child(2) { animation-delay: 0.2s; }
		.room-waiting-dots span:nth-child(3) { animation-delay: 0.4s; }
		@keyframes waiting-pulse {
			0%, 80%, 100% { opacity: 0.2; transform: scale(0.75); }
			40% { opacity: 1; transform: scale(1); }
		}
		/* Config locked state (client view) */
		.room-config-locked {
			opacity: 0.55;
			pointer-events: none;
		}
		/* Race HUD */
		#race-hud { pointer-events: none; }
		.hud-countdown {
