<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
	<title>Racing</title>
	<style>
		body { margin: 0; overflow: hidden; background: #000; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
		canvas { display: block; touch-action: none; }
		#editor-link {
			position: absolute;
			bottom: 12px;
			right: 16px;
			color: #fff;
			font: 14px sans-serif;
			text-decoration: none;
			background: rgba(0,0,0,0.5);
			padding: 8px 14px;
			border-radius: 6px;
			z-index: 10;
		}
		#editor-link:hover { background: rgba(0,0,0,0.7); }
		@media (pointer: coarse) {
			#editor-link { bottom: auto; top: 12px; right: 12px; }
		}
		/* Lobby */
		#lobby {
			position: absolute;
			inset: 0;
			display: flex;
			align-items: center;
			justify-content: center;
			z-index: 20;
			background: rgba(0,0,0,0.7);
			backdrop-filter: blur(8px);
		}
		.lobby-panel {
			text-align: center;
			color: #fff;
		}
		.lobby-panel h1 {
			font-size: 48px;
			margin: 0 0 32px;
			font-weight: 700;
			letter-spacing: 2px;
		}
		.lobby-buttons {
			display: flex;
			gap: 16px;
			justify-content: center;
			margin-bottom: 24px;
		}
		.lobby-buttons button {
			padding: 14px 32px;
			border: none;
			border-radius: 10px;
			font-size: 16px;
			font-weight: 600;
			cursor: pointer;
			transition: all 0.15s;
		}
		.lobby-buttons button:first-child {
			background: #4a9eff;
			color: #fff;
		}
		.lobby-buttons button:first-child:hover { background: #3a8eef; }
		.lobby-buttons button:last-child {
			background: rgba(255,255,255,0.15);
			color: #fff;
		}
		.lobby-buttons button:last-child:hover { background: rgba(255,255,255,0.25); }
		.lobby-buttons button:disabled { opacity: 0.5; cursor: default; }
		.lobby-status {
			color: rgba(255,255,255,0.7);
			font-size: 14px;
			margin-bottom: 16px;
		}
		.lobby-room-info input {
			width: 360px;
			padding: 10px 14px;
			border: 1px solid rgba(255,255,255,0.2);
			border-radius: 8px;
			background: rgba(255,255,255,0.1);
			color: #fff;
			font-size: 13px;
			text-align: center;
			margin-top: 8px;
		}
		.lobby-room-info p {
			color: rgba(255,255,255,0.5);
			font-size: 13px;
			margin: 0;
		}
		.player-list {
			display: flex;
			gap: 10px;
			justify-content: center;
			margin-bottom: 16px;
		}
		.player-badge {
			padding: 6px 14px;
			border-radius: 20px;
			font-size: 13px;
			font-weight: 500;
			background: rgba(255,255,255,0.12);
			text-transform: capitalize;
		}
		/* Lobby race options */
		.lobby-race-options {
			display: flex;
			flex-direction: column;
			align-items: center;
			gap: 16px;
			margin-top: 20px;
		}
		.mode-toggle {
			display: flex;
			gap: 4px;
			background: rgba(255,255,255,0.08);
			border-radius: 10px;
			padding: 4px;
		}
		.mode-btn {
			padding: 8px 20px;
			border: none;
			border-radius: 8px;
			background: transparent;
			color: rgba(255,255,255,0.5);
			font-size: 14px;
			font-weight: 600;
			cursor: pointer;
			transition: all 0.15s;
		}
		.mode-btn.active {
			background: rgba(255,255,255,0.18);
			color: #fff;
		}
		.lap-selector {
			display: flex;
			align-items: center;
			gap: 12px;
			color: rgba(255,255,255,0.7);
			font-size: 14px;
		}
		.lap-btn {
			width: 32px;
			height: 32px;
			border: 1px solid rgba(255,255,255,0.2);
			border-radius: 8px;
			background: rgba(255,255,255,0.08);
			color: #fff;
			font-size: 18px;
			cursor: pointer;
			display: flex;
			align-items: center;
			justify-content: center;
		}
		.lap-btn:hover { background: rgba(255,255,255,0.15); }
		#lap-count {
			min-width: 20px;
			text-align: center;
			font-weight: 600;
			font-size: 18px;
			color: #fff;
		}
		.start-btn {
			padding: 12px 40px;
			border: none;
			border-radius: 10px;
			background: #4a9eff;
			color: #fff;
			font-size: 16px;
			font-weight: 600;
			cursor: pointer;
			transition: background 0.15s;
		}
		.start-btn:hover { background: #3a8eef; }
		/* Race HUD */
		#race-hud { pointer-events: none; }
		.hud-countdown {
			position: fixed;
			inset: 0;
			display: none;
			align-items: center;
			justify-content: center;
			font-size: 120px;
			font-weight: 800;
			color: #fff;
			text-shadow: 0 0 40px rgba(74,158,255,0.6), 0 4px 20px rgba(0,0,0,0.5);
			z-index: 30;
		}
		.hud-countdown-active { display: flex; }
		.hud-countdown-pop {
			animation: countdown-pop 0.4s ease-out;
		}
		@keyframes countdown-pop {
			0% { transform: scale(1.8); opacity: 0; }
			50% { transform: scale(1); opacity: 1; }
			100% { transform: scale(1); opacity: 1; }
		}
		.hud-lap {
			position: fixed;
			top: 16px;
			left: 16px;
			z-index: 15;
			color: #fff;
			font-size: 14px;
		}
		.hud-lap-counter {
			font-size: 22px;
			font-weight: 700;
			margin-bottom: 4px;
		}
		.hud-lap-time { opacity: 0.7; }
		.hud-total-time { opacity: 0.5; font-size: 12px; }
		.hud-leaderboard {
			position: fixed;
			top: 16px;
			right: 16px;
			z-index: 15;
			color: #fff;
			font-size: 13px;
			background: rgba(0,0,0,0.4);
			border-radius: 10px;
			padding: 8px 12px;
			min-width: 160px;
		}
		.hud-leaderboard:empty { display: none; }
		.hud-lb-row {
			display: flex;
			gap: 8px;
			align-items: center;
			padding: 3px 0;
		}
		.hud-lb-pos {
			font-weight: 700;
			width: 18px;
			text-align: center;
		}
		.hud-lb-color {
			text-transform: capitalize;
			font-weight: 600;
			color: var(--truck-color, #fff);
		}
		.hud-lb-status {
			margin-left: auto;
			opacity: 0.7;
			font-size: 12px;
		}
		.hud-results {
			position: fixed;
			inset: 0;
			display: none;
			align-items: center;
			justify-content: center;
			background: rgba(0,0,0,0.7);
			backdrop-filter: blur(8px);
			z-index: 25;
		}
		.hud-results-panel {
			text-align: center;
			color: #fff;
			pointer-events: auto;
		}
		.hud-results-panel h2 {
			font-size: 36px;
			margin: 0 0 24px;
			font-weight: 700;
		}
		.hud-result-row {
			display: flex;
			gap: 16px;
			align-items: center;
			justify-content: center;
			padding: 8px 0;
			font-size: 18px;
		}
		.hud-result-pos {
			font-weight: 800;
			font-size: 24px;
			width: 50px;
			text-align: right;
		}
		.hud-result-color {
			text-transform: capitalize;
			font-weight: 600;
			color: var(--truck-color, #fff);
			width: 120px;
			text-align: left;
		}
		.hud-result-time { opacity: 0.7; }
	</style>
	<script type="importmap">
	{
		"imports": {
			"three": "https://cdn.jsdelivr.net/npm/three@0.183.2/build/three.module.js",
			"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.183.2/examples/jsm/",
			"crashcat": "https://esm.sh/crashcat@0.0.2",
			"@colyseus/sdk": "https://esm.sh/@colyseus/sdk@0.17.0"
		}
	}
	</script>
</head>
<body>
	<div id="lobby"></div>
	<div id="race-hud"></div>
	<a id="editor-link" href="editor.html">Create your own track</a>
	<script>
		const map = new URLSearchParams( location.search ).get( 'map' );
		if ( map ) {
			const link = document.getElementById( 'editor-link' );
			link.href = 'editor.html?map=' + map;
			link.textContent = 'Edit this track';
		}
	</script>
	<script type="module" src="js/main.js"></script>
</body>
</html>
